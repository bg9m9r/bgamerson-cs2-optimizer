name: Release

# Tag a commit to publish a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      # Signed build provenance for every published file (verify with
      # `gh attestation verify <file> --repo bg9m9r/bgamerson-cs2-optimizer`).
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap tooling
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Save-Module -Name Pester -MinimumVersion 5.0.0 -Path .\tools\Modules -Force
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }

      # The script's start-up update check compares $script:OptVersion with
      # the latest release tag. A tag that does not match the constant would
      # make every copy of that release nag its users about themselves.
      - name: Verify the version constant matches the tag
        shell: powershell
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF -replace '^refs/tags/', '' }
          $src = Get-Content src\00-Header.ps1 -Raw
          $pattern = [regex]::Escape('$script:OptVersion') + "\s*=\s*'([^']+)'"
          if ($src -notmatch $pattern) { throw 'No $script:OptVersion constant found in src\00-Header.ps1' }
          $version = $Matches[1]
          if ("v$version" -ne $tag) {
            throw "Tag $tag does not match the version constant '$version'. Bump it in src\00-Header.ps1, rebuild, commit, then re-tag."
          }
          "Version $version matches tag $tag"

      # Build and test BEFORE publishing. Shipping a release whose script fails
      # its own rollback tests would be worse than shipping nothing.
      - name: Build
        shell: powershell
        run: .\build\Build-Script.ps1

      - name: Test
        shell: powershell
        run: .\tests\Invoke-Tests.ps1 -NoRelaunch

      # Release notes live in .github/release-notes.md with {{ZIP}} and {{SHA}}
      # placeholders, rather than a here-string embedded in this YAML - an
      # unindented here-string line silently terminates a YAML block scalar.
      - name: Package
        id: pack
        shell: powershell
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if (-not $tag) { $tag = $env:GITHUB_REF -replace '^refs/tags/', '' }
          $zip = "bgamerson-cs2-optimizer-$tag.zip"

          $staging = Join-Path $env:RUNNER_TEMP 'pkg'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item dist\Optimize-CS2.ps1     -Destination $staging
          Copy-Item dist\Run-Optimize-CS2.cmd -Destination $staging
          Copy-Item dist\Launch-CS2.ps1      -Destination $staging
          Copy-Item dist\Launch-CS2.cmd      -Destination $staging
          Copy-Item README.md                 -Destination $staging
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $staging }
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -Force

          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # VirusTotal is queried directly rather than through a marketplace
      # action: a release created with the workflow token never fires the
      # `release` event, so release-triggered scanners cannot see it. The
      # report URL is deterministic (/gui/file/<sha256>), so the links can go
      # into the notes before the release exists. Skipped, with a note in the
      # release body, when the VT_API_KEY secret is not configured.
      - name: Upload the release files to VirusTotal
        id: vt
        shell: powershell
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          # curl reports HTTP failures on stderr; under the runner's default
          # ErrorActionPreference=Stop that would abort the step instead of
          # producing a "upload failed" line in the notes.
          $ErrorActionPreference = 'Continue'
          $files = @('dist\Optimize-CS2.ps1', 'dist\Run-Optimize-CS2.cmd', 'dist\Launch-CS2.ps1', 'dist\Launch-CS2.cmd', '${{ steps.pack.outputs.zip }}')
          $lines = New-Object System.Collections.ArrayList
          if (-not $env:VT_API_KEY) {
            [void]$lines.Add('_Not scanned: the VT_API_KEY secret is not configured for this repository._')
          }
          else {
            $n = 0
            foreach ($f in $files) {
              $sha = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
              # Free tier is 4 requests/minute.
              if ($n -gt 0) { Start-Sleep -Seconds 16 }
              $n++
              $resp = & curl.exe --silent --show-error --fail-with-body --request POST `
                --url 'https://www.virustotal.com/api/v3/files' `
                --header "x-apikey: $env:VT_API_KEY" --header 'accept: application/json' `
                --form "file=@$f"
              $ok = ($LASTEXITCODE -eq 0)
              $name = Split-Path -Leaf $f
              if ($ok) { [void]$lines.Add("- [$name](https://www.virustotal.com/gui/file/$sha) (SHA256 ``$sha``)") }
              else     { [void]$lines.Add("- $name (SHA256 ``$sha``): upload failed - $resp") }
            }
          }
          $vtFile = Join-Path $env:RUNNER_TEMP 'vt.md'
          [System.IO.File]::WriteAllText($vtFile, ($lines -join "`n"), (New-Object System.Text.UTF8Encoding $false))
          "vtFile=$vtFile" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Release notes live in .github/release-notes.md with {{ZIP}}, {{SHA}}
      # and {{VIRUSTOTAL}} placeholders, rather than a here-string embedded in
      # this YAML - an unindented here-string line silently terminates a YAML
      # block scalar.
      - name: Render release notes
        id: notes
        shell: powershell
        run: |
          $sha = (Get-FileHash dist\Optimize-CS2.ps1 -Algorithm SHA256).Hash
          $vt = Get-Content '${{ steps.vt.outputs.vtFile }}' -Raw
          $notes = Get-Content .github\release-notes.md -Raw
          $notes = $notes.Replace('{{ZIP}}', '${{ steps.pack.outputs.zip }}').Replace('{{SHA}}', $sha).Replace('{{VIRUSTOTAL}}', $vt.Trim())
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          # Set-Content -Encoding UTF8 under 5.1 writes a BOM, and gh passes it
          # through into the release body as a stray invisible character.
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding $false))
          "notesFile=$notesFile" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Before publishing, so a failed attestation fails the release rather
      # than leaving an unverifiable one up.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/Optimize-CS2.ps1
            dist/Run-Optimize-CS2.cmd
            dist/Launch-CS2.ps1
            dist/Launch-CS2.cmd
            ${{ steps.pack.outputs.zip }}

      - name: Create release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.pack.outputs.tag }}"
          "${{ steps.pack.outputs.zip }}"
          "dist/Optimize-CS2.ps1"
          "dist/Run-Optimize-CS2.cmd"
          "dist/Launch-CS2.ps1"
          "dist/Launch-CS2.cmd"
          --title "${{ steps.pack.outputs.tag }}"
          --notes-file "${{ steps.notes.outputs.notesFile }}"
